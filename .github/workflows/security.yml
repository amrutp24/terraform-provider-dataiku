name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Dependencies grow vulnerabilities without anyone touching the code, so
    # this runs on a timer as well as on changes.
    - cron: '31 5 * * 1'

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Scanning history, not just the diff, is the point: a secret that was
          # committed and later removed is still in the repository.
          fetch-depth: 0

      # Gitleaks is run directly rather than through its action, which derives a
      # commit range and cannot express "the first commit has no parent".
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan the full history
        run: ./gitleaks git . --config .gitleaks.toml --redact --verbose --no-banner

      - name: Scan the working tree
        run: ./gitleaks dir . --config .gitleaks.toml --redact --verbose --no-banner

  vulncheck:
    name: Known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Deliberately not go-version-file. The go directive in go.mod is the
          # minimum a consumer needs, whereas standard-library vulnerabilities
          # are fixed by building with a newer toolchain, so this checks against
          # the latest one rather than the oldest supported.
          go-version: 'stable'
          cache: true
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      # Job-level permissions replace the workflow-level block rather than
      # adding to it, so contents:read has to be repeated or the checkout of a
      # private repository fails.
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: go
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
