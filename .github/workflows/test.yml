name: Test

on:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go build -v ./...
      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  docs:
    name: Docs are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: make docs
      - name: Fail if docs would change
        run: |
          git diff --compact-summary --exit-code -- docs || \
            (echo "*** Docs are stale. Run 'make docs' and commit the result."; exit 1)

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go test -v -cover -race ./...
        timeout-minutes: 10

  fake:
    name: Acceptance tests (fake instance)
    runs-on: ubuntu-latest
    # The same suite as the job below, against the in-process fake rather than a
    # real instance. It needs no credentials and nothing to clean up, so unlike
    # that job it always runs.
    #
    # Without this the suite ran nowhere. resource.Test skips itself unless
    # TF_ACC is set, the unit test job does not set it, and the real-instance
    # job below is gated on a variable this repository does not define, so 25
    # acceptance tests skipped while CI reported green.
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        terraform:
          # 1.8 is the floor the provider supports; 1.11 is where write-only
          # arguments start working. Anything version-specific shows up as one
          # of these two failing on its own.
          - '1.8.*'
          - '1.11.*'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go mod download
      # DATAIKU_HOST is deliberately not set: testAccSetup starts the fake and
      # points the provider at it whenever that variable is empty.
      - env:
          TF_ACC: '1'
        run: go test -v -cover ./internal/provider/
        timeout-minutes: 15

  acceptance:
    name: Acceptance tests
    runs-on: ubuntu-latest
    # Acceptance tests create and delete real objects, so they only run when a
    # DSS instance has been configured for the repository.
    if: ${{ vars.DATAIKU_HOST != '' }}
    needs: [build, test]
    strategy:
      fail-fast: false
      matrix:
        terraform:
          - '1.8.*'
          - '1.11.*'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go mod download
      - env:
          TF_ACC: '1'
          DATAIKU_HOST: ${{ vars.DATAIKU_HOST }}
          DATAIKU_API_KEY: ${{ secrets.DATAIKU_API_KEY }}
        run: go test -v -cover ./internal/provider/
        timeout-minutes: 20
