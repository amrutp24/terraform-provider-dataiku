# A throwaway DSS instance for exercising the provider by hand.
#
#   docker compose -f dev/docker-compose.yml up -d
#
# First start takes a few minutes while DSS initialises. Then open
# http://localhost:10000 and sign in as admin / admin.
#
# dev/quickstart.sh (or quickstart.ps1) does that and the rest: waits for the
# instance, makes an API key and applies examples/quickstart.
#
# DSS_PORT and DSS_CONTAINER_NAME are there for when port 10000 is taken or a
# second instance has to run next to this one.
#
# This is Dataiku's evaluation image. It is not a production setup, and the
# data directory here is disposable: delete the volume to start clean.
services:
  dss:
    image: dataiku/dss:${DSS_VERSION:-latest}
    container_name: ${DSS_CONTAINER_NAME:-dataiku-dss-dev}
    ports:
      - "127.0.0.1:${DSS_PORT:-10000}:10000"
    volumes:
      - dss-data:/home/dataiku/dss
    # DSS wants a generous file descriptor limit and shared memory.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    shm_size: 1gb
    restart: unless-stopped

  # A database for TestAccConnectionReachesDatabase, which checks that a
  # connection the provider creates can actually be dialled rather than merely
  # accepted. Not started by default:
  #
  #   docker compose -f dev/docker-compose.yml --profile test up -d
  #
  # DSS reaches it by service name on the compose network, so nothing is
  # published to the host.
  postgres:
    image: postgres:16-alpine
    container_name: dss-test-postgres
    profiles: ["test"]
    environment:
      POSTGRES_USER: dku
      POSTGRES_PASSWORD: probe-pw
      POSTGRES_DB: probe
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dku -d probe"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dss-data:
